<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Enrollment Form</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 0;
}

.container {
    width: 80%;
    max-width: 900px;
    margin: 30px auto;
    background: #fff;
    padding: 30px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.header {
    background-color: #8b1f1f;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
}

.section-title {
    color: #8b1f1f;
    font-size: 20px;
    margin-top: 30px;
    margin-bottom: 15px;
    font-weight: bold;
}

.form-row {
    display: flex;
    gap: 20px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.form-group {
    flex: 1;
    display: flex;
    flex-direction: column;
}

label {
    margin-bottom: 5px;
    font-size: 14px;
}

input[type="text"],
input[type="email"],
input[type="date"],
input[type="tel"] {
    padding: 10px;
    border: 1px solid #999;
    border-radius: 3px;
}

input[type="radio"] {
    margin-right: 5px;
}

.full-width {
    width: 100%;
}

.signature-box {
    width: 300px;
    height: 100px;
    border: 1px solid #999;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
    <div class="header">Student Enrollment Forms</div>

    <!-- Student Information -->
    <div class="section-title">Student Information</div>

    <div class="form-row">
        <div class="form-group">
            <label>Student Name:</label>
            <div class="form-row">
                <input type="text" placeholder="First Name">
                <input type="text" placeholder="Last Name">
            </div>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Birth Date:</label>
            <input type="date">
        </div>

        <div class="form-group">
            <label>Gender:</label>
            <div>
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
            </div>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group full-width">
            <label>Student Address:</label>
            <input type="text" placeholder="Full Address">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Contact Number:</label>
            <input type="tel" placeholder="(000) 000-0000">
        </div>

        <div class="form-group">
            <label>Email Address:</label>
            <input type="email" placeholder="name@example.com">
        </div>
    </div>

    <!-- Parent Information -->
    <div class="section-title">Parent/Guardian Information</div>

    <div class="form-row">
        <div class="form-group full-width">
            <label>Parent/Guardian Name:</label>
            <input type="text" placeholder="Full Name">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Relationship To Student:</label>
            <input type="text" placeholder="Ex: Father/Mother">
        </div>

        <div class="form-group">
            <label>Contact Number:</label>
            <input type="tel" placeholder="(000) 000-0000">
        </div>

        <div class="form-group">
            <label>Email Address:</label>
            <input type="email" placeholder="name@example.com">
        </div>
    </div>

    <!-- Academic Information -->
    <div class="section-title">Academic Information</div>

    <div class="form-row">
        <div class="form-group">
            <label>Grade/Program Applying For:</label>
            <input type="text" placeholder="Ex: 8th Grade">
        </div>

        <div class="form-group">
            <label>Previous School (if applicable):</label>
            <input type="text" placeholder="Full Name">
        </div>
    </div>

    <!-- Consent -->
    <div class="section-title">Consent and Signature</div>
    <p>I confirm that all information provided above is true to the best of my knowledge.</p>

    <div class="signature-box"></div>
    <p><strong>Applicant Signature</strong></p>

</div>

</body>
</html>
