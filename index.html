<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My College Diary</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
    color: white;
}

/* HEADER */
header {
    backdrop-filter: blur(10px);
    background: rgba(0,0,0,0.6);
    padding: 20px 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
}

header h2 {
    color: gold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
    position: relative;
}

nav a::after {
    content: "";
    position: absolute;
    width: 0%;
    height: 2px;
    background: gold;
    left: 0;
    bottom: -5px;
    transition: 0.3s;
}

nav a:hover::after {
    width: 100%;
}

nav a:hover {
    color: gold;
}

/* SECTIONS */
section {
    padding: 100px 60px;
}

/* HERO */
.hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 90vh;
}

.text h1 {
    font-size: 55px;
}

.text h3 {
    color: gold;
    margin: 15px 0;
}

.text p {
    opacity: 0.8;
    margin-bottom: 25px;
}

/* BUTTON */
.btn {
    display: inline-block;
    background: linear-gradient(45deg, gold, orange);
    color: black;
    padding: 14px 30px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 0 20px gold;
}

/* IMAGE */
.image img {
    width: 350px;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(255,215,0,0.3);
}

/* BOX */
.box {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    padding: 25px;
    margin-top: 20px;
    border-radius: 15px;
    transition: 0.3s;
}

.box:hover {
    transform: translateY(-8px);
}

/* PORTFOLIO GRID */
.portfolio {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.portfolio img {
    width: 250px;
    margin: 10px;
    border-radius: 12px;
    transition: 0.3s;
    cursor: pointer;
}

.portfolio img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px gold;
}

/* LIGHTBOX */
#lightbox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
}

#lightbox img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 10px;
}

/* TITLES */
h2 {
    color: gold;
    margin-bottom: 15px;
}

/* RESPONSIVE */
@media (max-width: 900px) {
    .hero {
        flex-direction: column;
        text-align: center;
    }

    .image img {
        margin-top: 30px;
    }
}
</style>
</head>

<body>

<header>
    <h2>MY DIARY</h2>
    <nav>
        <a href="#home">HOME</a>
        <a href="#about">ABOUT</a>
        <a href="#services">SERVICES</a>
        <a href="#portfolio">PORTFOLIO</a>
        <a href="#blog">BLOG</a>
        <a href="#contact">CONTACT</a>
    </nav>
</header>

<!-- HERO -->
<section id="home" class="hero">
    <div class="text">
        <h1>Hello, I'm</h1>
        <h1>Miguel Enrico</h1>
        <h3>Graphic Designer</h3>
        <p>
            I create clean, modern, and meaningful designs.
            Passionate about creativity and continuous growth.
        </p>
        <a href="#contact" class="btn">LET'S TALK</a>
    </div>

    <div class="image">
        <img src="IMG_4483-removebg-preview.png" alt="Profile">
    </div>
</section>

<!-- PORTFOLIO -->
<section id="portfolio">
    <h2>PORTFOLIO</h2>
    <div class="box portfolio">
        <img src="1415.jpg" onclick="openImage(this.src)">
        <img src="1417.jpg" onclick="openImage(this.src)">
        <img src="1416.jpg" onclick="openImage(this.src)">
        <img src="1231.jpg" onclick="openImage(this.src)">
    </div>
</section>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeImage()">
    <img id="lightbox-img">
</div>

<!-- CONTACT -->
<section id="contact">
    <h2>CONTACT</h2>
    <div class="box">
        <p>Email: delosreyesmiguelenrico@gmail.com</p>
        <p>Phone: 09270722278</p>
    </div>
</section>

<script>
function openImage(src) {
    document.getElementById("lightbox").style.display = "flex";
    document.getElementById("lightbox-img").src = src;
}

function closeImage() {
    document.getElementById("lightbox").style.display = "none";
}
</script>

</body>
</html>
